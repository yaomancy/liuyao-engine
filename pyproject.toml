[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "liuyao-engine"
dynamic = ["version"]
description = "Deterministic I Ching (Liu Yao) hexagram engine — 六爻装卦/断法/历法确定性引擎，与 najia 交叉验证"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{ name = "Jincheng Xie" }]
keywords = ["liuyao", "najia", "yijing", "iching", "divination", "hexagram", "六爻", "纳甲"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Chinese (Simplified)",
    "Typing :: Typed",
]
dependencies = [
    "sxtwl>=2.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "mypy>=1.13",
    "lunar-python>=1.3.0",
    "najia>=0.0.9",
]

[project.urls]
Homepage = "https://yaomancy.com"
Repository = "https://github.com/yaomancy/liuyao-engine"

# 版本取自 git 标签（vX.Y.Z → X.Y.Z）。发布时在该提交上打标签即可，不要手写 version。
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "liuyao/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["liuyao"]

[tool.hatch.build.targets.sdist]
# 两部 ctext 古籍全文只作人工审计底本，运行时代码不读取，且体积远大于引擎本身。
exclude = ["/data/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 默认规则集。RUF022 会把 __all__ 按字母打散，冲掉按领域分组的公开 API 清单。
extend-select = ["E402"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.11"
packages = ["liuyao"]
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sxtwl", "sxtwl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=liuyao --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["liuyao"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
